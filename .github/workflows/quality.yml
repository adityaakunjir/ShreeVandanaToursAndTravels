name: Website quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vandana_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vandana_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TRAVEL_DEMO_MODE: 'false'
      NEXT_PUBLIC_SITE_URL: 'https://example.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, types, tests and production build
        run: npm run validate
      - name: Verify production routes and demo isolation
        run: npm run smoke:production
      - name: Verify enquiry migration and database constraints
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d vandana_test -v ON_ERROR_STOP=1 < database/migrations/001_enquiries.sql
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d vandana_test -v ON_ERROR_STOP=1 < database/tests/enquiries.sql
      - name: Verify persistent enquiry retries and rollback
        env:
          DATABASE_TEST_URL: postgres://postgres:isolated-ci-test-password@127.0.0.1:5432/vandana_test
        run: npm run test:database
